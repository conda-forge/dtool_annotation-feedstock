schema_version: 1

context:
  name: dtool_annotation
  version: "0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/dtool-annotation/${{ name }}-${{ version }}.tar.gz
  sha256: 8f064bd426a774fdeaad504dfdced08b4e81bc01eac0dcfbff94d0ac9e852057

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - click
    - dtool_cli
    - dtoolcore >=3.13.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dtool_annotation
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE.rst
  summary: Add ability to annotate datasets using the dtool CLI
  description: |
    dtool CLI commands for working with per dataset metadata (annotations)
  homepage: https://github.com/jic-dtool/dtool-annotation
  repository: https://github.com/jic-dtool/dtool-annotation
  documentation: https://github.com/jic-dtool/dtool-annotation

extra:
  recipe-maintainers:
    - jan-janssen
    - tjelvar-olsson
